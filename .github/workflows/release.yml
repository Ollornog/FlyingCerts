name: release

# Der Trockenlauf (`workflow_dispatch`) fehlte hier ganz — und damit die einzige Moeglichkeit,
# diesen Workflow VOR einem Tag zu pruefen. Ein Workflow mit `on: push: tags` wird von der
# normalen CI nie beruehrt; er sieht gepflegt aus, weil das Repo gruen ist, aber das Gruen kommt
# von einem anderen Workflow. Genau hier ist der erste `v0.1.0`-Tag rot gelaufen (fehlendes
# Pebble, s.u.) — und beim zweiten Mal wieder. Seit 2026-09-24: bauen darf jeder Lauf,
# veroeffentlichen nur der Tag-Lauf.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Bauen und veroeffentlichen
    runs-on: ubuntu-latest
    permissions:
      contents: write        # nur dieser Job legt das Release an
    steps:
      # `persist-credentials: false` ist EIGENE Haertung, kein belegter Standard
      # (siehe ci.yml). Dieser Job veroeffentlicht zwar, aber ueber `gh release
      # create` mit GH_TOKEN aus der Job-Umgebung — er braucht die git-Credentials
      # im Arbeitsbaum nicht, also darf checkout sie auch nicht liegen lassen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # Erst pruefen, dann bauen: ein Tag, der nicht zur Version im Quelltext passt,
      # erzeugt ein Release, das niemand mehr zuordnen kann.
      - name: Tag gegen internal/version pruefen
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          QUELLE="$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)"
          if [ "$TAG" != "$QUELLE" ]; then
            echo "Tag $TAG passt nicht zu internal/version/version.go ($QUELLE)" >&2
            exit 1
          fi
          echo "Version $QUELLE bestaetigt"

      # Ohne Tag ist der Vergleich unmoeglich — geprueft wird, was pruefbar ist: dass die
      # Version im Quelltext ueberhaupt lesbar ist und im CHANGELOG steht.
      - name: Trockenlauf — Version und CHANGELOG
        if: github.ref_type != 'tag'
        run: |
          QUELLE="$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)"
          [ -n "$QUELLE" ] || { echo "Version nicht aus internal/version/version.go lesbar" >&2; exit 1; }
          echo "Trockenlauf ohne Tag. Version im Quelltext: $QUELLE"
          grep -q "\[$QUELLE\]" CHANGELOG.md \
            || { echo "CHANGELOG kennt Version $QUELLE nicht" >&2; exit 1; }
          echo "CHANGELOG kennt $QUELLE — bereit fuer den Tag v$QUELLE"

      # Dieselbe Test-CA wie in ci.yml, und aus demselben Grund: die Suite
      # laesst die Ende-zu-Ende-Tests auf einem Runner absichtlich scheitern
      # statt sie zu ueberspringen. Fehlt Pebble hier, ist der Release-Lauf rot
      # — was beim ersten v0.1.0-Tag genau so passiert ist. Ein Release-Workflow
      # muss jede Umgebung mitbringen, die seine Suite braucht; dass ci.yml sie
      # hat, hilft ihm nicht.
      #
      # Per Digest gepinnt, nicht `latest`: Pebble veroeffentlicht keine
      # versionierten Container-Tags (Stand v2.10.1, 20.04.2026), und zwei
      # Laeufe muessen dasselbe Abbild bekommen.
      - name: Test-CA starten (Pebble)
        run: |
          docker network create pebble
          docker run -d --name challtestsrv --network pebble \
            -p 8055:8055 \
            ghcr.io/letsencrypt/pebble-challtestsrv@sha256:12ce21884def456bcf9786542113949e1f19dc7738d2c70e156c2d0c38a1405b \
            -defaultIPv6 "" -defaultIPv4 127.0.0.1
          docker run -d --name pebble --network pebble \
            -p 14000:14000 -e PEBBLE_VA_NOSLEEP=1 \
            ghcr.io/letsencrypt/pebble@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199 -dnsserver challtestsrv:8053
          for _ in $(seq 30); do
            curl -sk https://localhost:14000/dir >/dev/null && break
            sleep 1
          done
          # Nicht nur "antwortet", sondern "kann ARI": die Erneuerungstests
          # fragen renewalInfo ab.
          curl -sk https://localhost:14000/dir | grep -q renewalInfo

      - name: Volle Suite
        run: scripts/check.sh

      - name: Binaries bauen
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          # Im Trockenlauf ist REF_NAME ein Branchname — die Binaries hiessen dann
          # `..._main_linux_amd64`. Damit der Trockenlauf DASSELBE baut wie der Tag-Lauf,
          # kommt die Version dann aus dem Quelltext.
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            VERSION="v$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)"
            echo "Trockenlauf: Version aus dem Quelltext ($VERSION)"
          fi
          for ziel in linux/amd64 linux/arm64; do
            GOOS="${ziel%/*}"; GOARCH="${ziel#*/}"
            for programm in flying-certs-server flying-certs-agent; do
              test -d "cmd/$programm" || continue
              export GOOS GOARCH
              go build -trimpath \
                -ldflags "-s -w" \
                -o "dist/${programm}_${VERSION}_${GOOS}_${GOARCH}" \
                "./cmd/$programm"
            done
          done
          ls -l dist/

      - name: Pruefsummen
        working-directory: dist
        # `-- *` statt `*`: ein Dateiname, der mit - beginnt, wuerde sonst als
        # Option gelesen (SC2035). `./*` taete es auch, schriebe aber './name' in
        # die VEROEFFENTLICHTE SHA256SUMS — `--` haelt die Namen blank.
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      # Nur beim Tag. Bis 2026-09-24 haette allein `--verify-tag` einen Branch-Lauf gebremst —
      # auf einen Zufall soll sich das Veroeffentlichen nicht verlassen.
      - name: Release anlegen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

      # Wenn die Suite kippt, ist die erste Frage, was die Test-CA gesehen hat.
      - name: Pebble-Protokoll bei Fehlschlag
        if: failure()
        run: |
          echo "::group::pebble"; docker logs pebble 2>&1 | tail -80; echo "::endgroup::"
          echo "::group::challtestsrv"; docker logs challtestsrv 2>&1 | tail -40; echo "::endgroup::"
