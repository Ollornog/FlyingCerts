# Dependabot Auto-Merge (PO 2026-09-28): Lässt sich ein Update automatisieren und nimmt ein Test es
# ab, laufen Update und Merge automatisch. Majors und alles, was kein Test abnimmt, bleiben von Hand.
#
# WARUM workflow_run (alle Repos, seit 2026-09-28 auch die öffentlichen): Der Folgelauf startet erst,
# wenn der CI-Lauf fertig ist, läuft im Kontext des Default-Branch und darf schreiben. Gemergt wird
# nur bei `success` des GANZEN CI-Laufs; wo Branch-Protection gilt, verweigert GitHub den Merge
# zusätzlich, solange ein Pflicht-Check fehlt oder der Zweig veraltet ist.
#
# NACHLAUF: Ein Push mit dem Workflow-Token startet KEINE Workflows (GitHub-Doku, GITHUB_TOKEN) —
# nach dem Merge lief auf dem Default-Branch keine CI, keine Pages, kein Abbild-Neubau. Ausgenommen
# ist `workflow_dispatch`: Deshalb stößt dieser Job die Workflows danach selbst an.
#
# Ohne Fremd-Action und ohne eigenes Geheimnis: Update-Typ und Ökosystem kommen per API aus den
# Commits und dem Branchnamen von Dependabot. Kein Checkout, kein PR-Code; Werte über env;
# Merge nur mit --match-head-commit; läuft auf ubuntu-latest, nie self-hosted.
name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  automerge:
    # Fork-Schutz über den KOPF: `workflow_run.repository` ist immer das Basis-Repo (Hinweis aus der
    # TinySesam-Session, 2026-09-28). Die API-Prüfung im Schritt bleibt zusätzlich.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Prüfen, mergen, Nachlauf anstoßen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          STANDARD: ${{ github.event.repository.default_branch }}
          # Ökosysteme, die die CI dieses Repos tatsächlich abnimmt.
          AUTO_OEKO: "github_actions go_modules"
          # Workflows, die auf dem Default-Branch laufen sollen (brauchen `workflow_dispatch`).
          NACHLAUF: "ci.yml"
        run: |
          PR="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" -q '.[0].number')"
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "Kein PR zu $HEAD_SHA"; exit 0; }
          set -euo pipefail
          # Herkunft per API, nie dem Ereignis glauben: Autor Dependabot, kein Fork, offen, Kopf unverändert.
          J="$(gh api "repos/$REPO/pulls/$PR")"
          [ "$(jq -r '.user.login' <<<"$J")" = "dependabot[bot]" ] || { echo "Autor ist nicht Dependabot — nichts zu tun"; exit 0; }
          [ "$(jq -r '.head.repo.full_name == .base.repo.full_name' <<<"$J")" = "true" ] || { echo "Fork — Abbruch"; exit 1; }
          [ "$(jq -r '.state' <<<"$J")" = "open" ] || { echo "PR nicht offen"; exit 0; }
          [ "$(jq -r '.head.sha' <<<"$J")" = "$HEAD_SHA" ] || { echo "Kopf seit dem Lauf bewegt — kein Merge"; exit 0; }
          # Ökosystem aus dem Branch (dependabot/<ökosystem>/…), Update-Typ aus der Commit-Nachricht
          # (Block `updated-dependencies`). Fehlt der Typ, gilt es als unklar — dann von Hand. Das
          # trifft absichtlich Bereichs-Updates (`>=` in pyproject/uv): Dependabot nennt dort keinen.
          ZWEIG="$(jq -r '.head.ref' <<<"$J")"
          OEKO="${ZWEIG#dependabot/}"; OEKO="${OEKO%%/*}"
          # ALLE Commits des PRs, nicht nur der Kopf: der kann ein Merge-Commit sein. Stammt einer
          # nicht von Dependabot, steckt fremde Arbeit im PR — dann von Hand.
          COMMITS="$(gh api "repos/$REPO/pulls/$PR/commits" --paginate)"
          NACHRICHTEN="$(jq -r '.[].commit.message' <<<"$COMMITS")"
          TYPEN="$(grep -oE 'update-type: version-update:semver-(major|minor|patch)' <<<"$NACHRICHTEN" | sort -u || true)"
          GRUND=""
          [ "$(jq -r '[.[] | select(.author.login != "dependabot[bot]")] | length' <<<"$COMMITS")" = "0" ] \
            || GRUND="Commits, die nicht von Dependabot stammen"
          [ -n "$TYPEN" ] || GRUND="Update-Typ nicht erkennbar"
          grep -q 'semver-major' <<<"$TYPEN" && GRUND="Major-Update"
          case " $AUTO_OEKO " in *" $OEKO "*) ;; *) GRUND="${GRUND:-kein Test nimmt \"$OEKO\" ab}" ;; esac
          # Actions nur, wenn JEDE aktualisierte Action in ci.yml läuft — dem Workflow der
          # Pflicht-Checks. Eine Action, die nur ein Release- oder Pages-Workflow nutzt, prüft kein
          # Test; ihr Bump bräche erst bei der nächsten Veröffentlichung (Einwand 2026-09-28).
          if [ -z "$GRUND" ] && [ "$OEKO" = "github_actions" ]; then
            CI_YML="$(gh api "repos/$REPO/contents/.github/workflows/ci.yml?ref=$HEAD_SHA" -q .content | base64 -d)"
            NAMEN="$(sed -n 's/^[- ]*dependency-name: *//p' <<<"$NACHRICHTEN" | sort -u)"
            [ -n "$NAMEN" ] || GRUND="aktualisierte Actions nicht erkennbar"
            while IFS= read -r n; do
              [ -z "$n" ] && continue
              grep -qE "uses:[[:space:]]*${n//./\\.}(/[^@[:space:]]*)?@" <<<"$CI_YML" \
                || { GRUND="Action \"$n\" läuft nicht in ci.yml"; break; }
            done <<<"$NAMEN"
          fi
          if [ -n "$GRUND" ]; then
            gh pr comment "$PR" --repo "$REPO" --body "⚠️ Nicht automatisch gemergt: $GRUND. CI ist grün — bitte von Hand prüfen und mergen."
            exit 0
          fi
          if ! gh pr merge "$PR" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"; then
            echo "Nicht mergebar (Pflicht-Checks, veralteter Zweig oder Konflikt) — die ci-wache meldet den PR, wenn er liegen bleibt."
            exit 0
          fi
          for wf in $NACHLAUF; do
            gh workflow run "$wf" --repo "$REPO" --ref "$STANDARD" && echo "Nachlauf angestoßen: $wf"
          done
