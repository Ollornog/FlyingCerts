name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Vorgabe fuer alle Jobs: nur lesen. Wer schreiben muss, erhoeht im eigenen Job.
permissions:
  contents: read

jobs:
  test:
    name: Tests und Hygiene
    runs-on: ubuntu-latest   # oeffentliches Repo -> niemals self-hosted (Fork-PRs)
    steps:
      # `persist-credentials: false` ist EIGENE Haertung, kein belegter Standard —
      # GitHub empfiehlt es nirgends ausdruecklich. Seit checkout@v6 liegt das Token
      # in $RUNNER_TEMP statt in .git/config; es zaehlt dort, wo nach dem Checkout
      # fremder Code laeuft — hier `go mod download` und die Test-CA-Container.
      # Kein Job in diesem Repo pusht selbst, also braucht keiner eine Ausnahme.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Volle Historie, weil der Doku-Schnellpfad unten `git diff <basis>..HEAD`
          # rechnet. Mit der Vorgabe (Tiefe 1) liegt `base.sha` eines PR nicht im Klon,
          # der Diff scheitert — und das Skript faellt fail-closed auf die volle Suite
          # zurueck. Der Schnellpfad waere dann nur Zierde.
          fetch-depth: 0

      # ── Doku-Schnellpfad: beruehrt dieser Aenderungssatz NUR Doku? ────────────
      #
      # Die Dateimenge und die Begruendung jeder Grenze stehen in
      # scripts/_nur_doku.sh; tests/test_doku_schnellpfad.py haelt sie fest.
      #
      # WARUM auf SCHRITT-Ebene und nicht per `paths-ignore` am Workflow: Der
      # Required Check dieses Repos heisst `Tests und Hygiene`. Ein per Pfadfilter
      # unterdrueckter Workflow legt seine Checks NIE an — sie bleiben auf
      # "Expected/Pending" stehen und der PR ist dauerhaft nicht mergebar. GitHub
      # sagt das woertlich: "Associated checks stay in a 'Pending' state and block
      # merging ... Avoid requiring workflows that can be skipped."
      # (docs.github.com/en/pull-requests/how-tos/merge-and-close-pull-requests/troubleshooting-required-status-checks)
      #
      # Ein per `if:` uebersprungener JOB waere laut derselben Quelle unbedenklich
      # ("A job that is skipped will report its status as Success. It will not
      # prevent a pull request from merging, even if it is a required check") —
      # hier laeuft der Job trotzdem: Er tut im Schnellpfad etwas (die Hygiene),
      # und ein gruen LAUFENDER Check ist als Gate staerker als ein uebersprungener.
      - name: Umfang der Aenderung
        id: umfang
        env:
          # Kein `${{ }}` mitten im Skript: der Wert kommt ueber die Umgebung.
          BASIS: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          nur_doku="$(./scripts/_nur_doku.sh --seit "$BASIS")"
          echo "nur_doku=$nur_doku" >> "$GITHUB_OUTPUT"
          if [ "$nur_doku" = "true" ]; then
            echo "Nur Doku beruehrt — Schnellpfad: Hygiene ja, Go und Test-CA nein." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Code beruehrt (oder Umfang nicht ermittelbar) — volle Suite." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: steps.umfang.outputs.nur_doku != 'true'
        with:
          go-version-file: go.mod
          check-latest: true

      # Die Test-CA muss auf dem Runner LAUFEN, sonst ueberspringt der
      # Ende-zu-Ende-Test sich selbst und das Gate prueft genau das nicht, was
      # es pruefen soll. Der Test scheitert auf dem Runner absichtlich, wenn
      # Pebble fehlt, statt sich stillschweigend zu ueberspringen.
      #
      # Per Digest gepinnt, nicht `latest`. Pebble veroeffentlicht keine
      # versionierten Container-Tags (Stand v2.10.1, 20.04.2026), also ist der
      # Digest die einzige Moeglichkeit, zweimal dasselbe Abbild zu bekommen —
      # und dieselbe Regel wie bei den Actions weiter oben.
      - name: Test-CA starten (Pebble)
        if: steps.umfang.outputs.nur_doku != 'true'
        run: |
          docker network create pebble
          docker run -d --name challtestsrv --network pebble \
            -p 8055:8055 \
            ghcr.io/letsencrypt/pebble-challtestsrv@sha256:12ce21884def456bcf9786542113949e1f19dc7738d2c70e156c2d0c38a1405b \
            -defaultIPv6 "" -defaultIPv4 127.0.0.1
          docker run -d --name pebble --network pebble \
            -p 14000:14000 -e PEBBLE_VA_NOSLEEP=1 \
            ghcr.io/letsencrypt/pebble@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199 -dnsserver challtestsrv:8053
          for _ in $(seq 30); do
            curl -sk https://localhost:14000/dir >/dev/null && break
            sleep 1
          done
          # Nicht nur "antwortet", sondern "kann ARI": die Erneuerungstests
          # fragen renewalInfo ab, und ein Directory ohne diesen Eintrag
          # liesse sie an einer Stelle scheitern, die nichts damit zu tun hat.
          curl -sk https://localhost:14000/dir | grep -q renewalInfo

      - name: Volle Suite
        if: steps.umfang.outputs.nur_doku != 'true'
        run: scripts/check.sh

      # Die Zusage aus CONTRIBUTING: ein Test, der beim zweiten Lauf rot wird, ist kaputt.
      # Genau das wird hier nachgewiesen, statt es nur zu behaupten.
      - name: Zweiter Lauf — Wiederholbarkeit
        if: steps.umfang.outputs.nur_doku != 'true'
        run: scripts/check.sh

      # Der Schnellpfad ueberspringt Go, NICHT die Hygiene: Namens- und
      # Adress-Sperrliste, Geheimnis-Muster, Fremdressourcen-Pruefung,
      # Versionsgleichstand und Backlog-Pruefungen treffen eine README genauso wie
      # Code. Auch hier zweimal — die Wiederholbarkeit gilt in jedem Pfad.
      - name: Hygiene (Doku-Schnellpfad)
        if: steps.umfang.outputs.nur_doku == 'true'
        run: scripts/check.sh --nur-hygiene

      - name: Zweiter Lauf — Hygiene
        if: steps.umfang.outputs.nur_doku == 'true'
        run: scripts/check.sh --nur-hygiene

      # Wenn die Suite kippt, ist die erste Frage, was die Test-CA gesehen hat.
      # Ohne das bleibt nur der Fehlertext des Clients — und der sagte beim
      # ersten v0.1.0-Versuch zwar, WAS Pebble antwortete, aber nicht warum.
      - name: Pebble-Protokoll bei Fehlschlag
        # Im Schnellpfad laeuft keine Test-CA: `docker logs` waere dort ein zweiter
        # Fehler ueber dem ersten und wuerde die echte Ursache verdecken.
        if: failure() && steps.umfang.outputs.nur_doku != 'true'
        run: |
          echo "::group::pebble"; docker logs pebble 2>&1 | tail -80; echo "::endgroup::"
          echo "::group::challtestsrv"; docker logs challtestsrv 2>&1 | tail -40; echo "::endgroup::"
