name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Vorgabe fuer alle Jobs: nur lesen. Wer schreiben muss, erhoeht im eigenen Job.
permissions:
  contents: read

jobs:
  test:
    name: Tests und Hygiene
    runs-on: ubuntu-latest   # oeffentliches Repo -> niemals self-hosted (Fork-PRs)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # Die Test-CA muss auf dem Runner LAUFEN, sonst ueberspringt der
      # Ende-zu-Ende-Test sich selbst und das Gate prueft genau das nicht, was
      # es pruefen soll. Der Test scheitert auf dem Runner absichtlich, wenn
      # Pebble fehlt, statt sich stillschweigend zu ueberspringen.
      - name: Test-CA starten (Pebble)
        run: |
          docker network create pebble
          docker run -d --name challtestsrv --network pebble \
            -p 8055:8055 \
            ghcr.io/letsencrypt/pebble-challtestsrv:latest \
            -defaultIPv6 "" -defaultIPv4 127.0.0.1
          docker run -d --name pebble --network pebble \
            -p 14000:14000 -e PEBBLE_VA_NOSLEEP=1 \
            ghcr.io/letsencrypt/pebble:latest -dnsserver challtestsrv:8053
          for i in $(seq 30); do
            curl -sk https://localhost:14000/dir >/dev/null && break
            sleep 1
          done
          curl -sk https://localhost:14000/dir >/dev/null

      - name: Volle Suite
        run: scripts/check.sh

      # Die Zusage aus CONTRIBUTING: ein Test, der beim zweiten Lauf rot wird, ist kaputt.
      # Genau das wird hier nachgewiesen, statt es nur zu behaupten.
      - name: Zweiter Lauf — Wiederholbarkeit
        run: scripts/check.sh
